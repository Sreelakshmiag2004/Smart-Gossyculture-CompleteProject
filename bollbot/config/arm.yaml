# Robotic harvesting arm (spec Section 10). MEASURE every (A) value on the
# assembled arm before the first powered move.
#
# Frames: ARM BASE frame has its origin on the base's yaw axis at the
# mounting plate; x points forward (toward the plant row), y left, z up.
# Lengths are axis-to-axis, in metres.
links_m:
  base_height: 0.10        # (A) mounting plate -> shoulder axis
  upper_arm: 0.15          # (A) shoulder axis -> elbow axis
  forearm: 0.15            # (A) elbow axis -> wrist axis
  tool: 0.08               # (A) wrist axis -> nozzle mouth (picking head)

# Servo degrees <-> joint angles: joint = direction * (servo - zero_deg).
# zero_deg is the servo reading when the joint is at its reference:
#   base: arm points along +x;   shoulder: upper arm horizontal;
#   elbow: forearm in line with upper arm (or horizontal if forearm_absolute);
#   wrist: tool in line with forearm.
# min/max MUST equal kJoints in firmware/esp32/bollbot_fw/config.h.
joints:
  - {name: base,     zero_deg: 90, direction: 1,  min_deg: 0,  max_deg: 180}
  - {name: shoulder, zero_deg: 90, direction: 1,  min_deg: 20, max_deg: 160}
  - {name: elbow,    zero_deg: 90, direction: 1,  min_deg: 10, max_deg: 170}
  - {name: wrist,    zero_deg: 90, direction: 1,  min_deg: 30, max_deg: 150}
forearm_absolute: false     # true for parallel-linkage arms (elbow servo sets the forearm's angle to horizontal)

pick:
  preferred_pitch_deg: 0     # approach angle of the head; 0 = horizontal into the plant
  pitch_tolerance_deg: 30    # IK may tilt the approach up to this much
  standoff_m: 0.04           # pre-pick point this far before the boll
  boll_radius_m: 0.02        # head stops at the boll surface, not its centre
  approach_speed_dps: 40
  final_speed_dps: 15        # slow last few centimetres
  dwell_s: 2.0               # head ON at the boll (spec: 2 s)
  min_conf: 0.5              # only confident open-boll detections
  max_range_m: 0.8           # ignore detections further than this from the camera
  max_attempts_per_boll: 1

# Calibration poses (servo degrees): spread across the working volume, all
# within limits. At each pose the camera locates an ArUco tag (DICT_4X4_50,
# id 0, 2 cm) stuck flat on the nozzle mouth, facing the camera.
calibration_poses:
  - [70, 60, 120, 90]
  - [90, 60, 120, 90]
  - [110, 60, 120, 90]
  - [70, 80, 100, 90]
  - [90, 80, 100, 90]
  - [110, 80, 100, 90]
  - [80, 70, 130, 70]
  - [100, 70, 130, 110]
  - [90, 90, 90, 90]
  - [90, 50, 140, 100]
