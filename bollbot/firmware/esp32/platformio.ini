; Build with PlatformIO (VS Code extension or `pio run -t upload`), or open
; bollbot_fw/bollbot_fw.ino in the Arduino IDE with the same three libraries.
[platformio]
src_dir = bollbot_fw

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0
    adafruit/Adafruit PWM Servo Driver Library@^3.0
build_flags = -std=gnu++17
build_unflags = -std=gnu++11
