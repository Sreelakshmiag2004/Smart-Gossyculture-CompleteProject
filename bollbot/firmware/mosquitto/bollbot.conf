# /etc/mosquitto/conf.d/bollbot.conf on the Raspberry Pi
#   sudo apt install mosquitto mosquitto-clients
#   sudo mosquitto_passwd -c /etc/mosquitto/passwd pi      (Pi programs)
#   sudo mosquitto_passwd    /etc/mosquitto/passwd esp32   (ESP32, same as secrets.h)
#   sudo cp bollbot.conf /etc/mosquitto/conf.d/ && sudo systemctl restart mosquitto
# Watch traffic:  mosquitto_sub -u pi -P <password> -t 'cart/#' -v
listener 1883
allow_anonymous false
password_file /etc/mosquitto/passwd
