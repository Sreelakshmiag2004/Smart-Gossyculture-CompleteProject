# Alembic configuration. The database URL is NOT stored here: migrations/env.py builds it
# from GOSSY_DB_* environment variables (password from GOSSY_DB_PASSWORD_FILE).
# Logging is configured by migrations/env.py (structured JSON), not by this file.
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src
path_separator = os
