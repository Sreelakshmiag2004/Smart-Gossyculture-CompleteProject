# Eclipse Mosquitto - DEVELOPMENT configuration (not a production configuration).
# TLS-only listener, no anonymous access, per-client credentials, per-topic ACL.

per_listener_settings false
allow_anonymous false
password_file /mosquitto/generated/passwd
acl_file /mosquitto/config/acl

# Queue QoS 1 messages for persistent sessions (e.g. while the ingest service restarts).
persistence true
persistence_location /mosquitto/data/
# Phase 2.5: save the in-memory store after EVERY change (queued message, subscription,
# retained message) instead of every 30 s. A broker killed without a clean shutdown otherwise
# loses messages it has already PUBACKed to devices (measured: 12/12 lost with the 30 s timer).
# Cost: one store write per change - acceptable at pilot scale; revisit for production (U-15).
autosave_on_changes true
autosave_interval 1
max_queued_messages 10000
persistent_client_expiration 2d
max_packet_size 131072

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# MQTT over TLS only. There is no plaintext (1883) listener.
listener 8883
protocol mqtt
cafile /mosquitto/generated/ca.crt
certfile /mosquitto/generated/broker.crt
keyfile /mosquitto/generated/broker.key
tls_version tlsv1.2
# Client certificates are not required yet: production device credential type is U-7.
require_certificate false
