# Scraped by the CloudWatch agent on the host. Targets are loopback-only ports (not public).
global:
  scrape_interval: 60s
  scrape_timeout: 10s
scrape_configs:
  - job_name: gossy-ingest
    static_configs:
      - targets: ["127.0.0.1:8001"]
        labels: {Environment: "__ENVIRONMENT__"}
  - job_name: gossy-api
    static_configs:
      - targets: ["127.0.0.1:8000"]
        labels: {Environment: "__ENVIRONMENT__"}
