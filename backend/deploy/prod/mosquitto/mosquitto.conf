# Eclipse Mosquitto - STAGING/PRODUCTION configuration (single broker, pilot scale).
# TLS-only listener, no anonymous access, per-client credentials, per-topic ACL.
# Broker high availability / replication is a future decision (not implemented).

per_listener_settings false
allow_anonymous false
password_file /mosquitto/generated/passwd
acl_file /mosquitto/config/acl

# Persistent sessions + queued QoS 1 messages (Phase 2.5 reliability contract).
persistence true
persistence_location /mosquitto/data/
# Save the store after every change (Phase 2.5: a killed broker otherwise loses messages it has
# already PUBACKed). Survives a broker process crash; host power loss is not covered (no fsync).
autosave_on_changes true
autosave_interval 1
# Queue bound per session. NOT increased: pilot sizing is DECISION NEEDED (see the Phase 3
# report, queue capacity calculation). When exceeded the broker drops new messages.
max_queued_messages 10000
persistent_client_expiration 2d
max_packet_size 131072

# No $SYS status publishing and no management/WebSocket listener.
sys_interval 0

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# MQTT over TLS only (8883). There is no plaintext (1883) and no WebSocket listener.
listener 8883
protocol mqtt
# Publicly trusted certificate for GOSSY_MQTT_PUBLIC_HOST (obtained by Caddy, synced by
# bin/sync-broker-cert.sh). Never the development CA.
certfile /mosquitto/generated/cert.crt
keyfile /mosquitto/generated/cert.key
cafile /mosquitto/generated/chain.crt
tls_version tlsv1.2
# Device client certificates are NOT required: the production device credential type is
# unresolved (U-7).
require_certificate false
